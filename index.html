<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CuriousLab Academy: Interactive Learning for Future Innovators</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="CuriousLab Academy empowers young learners with interactive courses in Science, Math, English, Coding, Robotics, AI, Chess, and Abacus Mental Math with RoboBuddy." />
    <meta name="keywords" content="CuriousLab, learning academy, kids courses, abacus mental math, RoboBuddy, coding for kids, AI for kids, science experiments, chess for children, robotics club, online learning Nigeria" />

    <!-- Open Graph -->
    <meta property="og:title" content="CuriousLab Academy" />
    <meta property="og:description" content="Fun and interactive online courses for kids: Science, Math, Coding, Robotics, AI, Chess, and more. Learn with RoboBuddy to master Abacus Mental Math!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://curiouslabacademy.com" />
    <meta property="og:image" content="https://curiouslabacademy.com/images/og-image.jpg" />

    <link rel="canonical" href="https://curiouslabacademy.com" />

    <!-- Structured Data for Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CuriousLab Academy",
      "url": "https://curiouslabacademy.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://curiouslabacademy.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data for Navigation (Courses) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "CuriousLab Academy Courses",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "Science Explorers",
          "description": "Discover the wonders of science through experiments and hands-on activities.",
          "url": "https://curiouslabacademy.com/courses/science-explorers"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "Math Wiz",
          "description": "Master mathematics through games, puzzles, and interactive problem-solving.",
          "url": "https://curiouslabacademy.com/courses/math-wizards"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "English Express",
          "description": "Boost reading, writing, and speaking skills with our engaging English program.",
          "url": "https://curiouslabacademy.com/courses/english-express"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "Native Languages",
          "description": "Learn Yoruba, Igbo, and Hausa to connect with your cultural roots.",
          "url": "https://curiouslabacademy.com/courses/native-languages"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 5,
          "name": "Abacus Mental Math",
          "description": "Learn Abacus Mental Math to boost cognitive development, sharpen focus, and build strong mathematical initiative. Train with RoboBuddy to develop lightning-fast speed and accuracy in problem-solving",
          "url": "https://curiouslabacademy.com/courses/abacus-math"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 6,
          "name": "AI Innovators",
          "description": "Step into the future and build your own Artificial Intelligence projects.",
          "url": "https://curiouslabacademy.com/courses/ai-innovators"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 7,
          "name": "Coding for Kids",
          "description": "Learn Scratch and Python through games, apps, and creative projects.",
          "url": "https://curiouslabacademy.com/courses/coding-for-kids"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 8,
          "name": "Robotics Club",
          "description": "Build and program real robots while learning teamwork and engineering skills.",
          "url": "https://curiouslabacademy.com/courses/robotics-club"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 9,
          "name": "Chess Champions",
          "description": "Boost strategy and critical thinking with professional chess lessons.",
          "url": "https://curiouslabacademy.com/courses/chess-champions"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
